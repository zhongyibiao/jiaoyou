upstream jiaoyou_api {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 64;
}

# 后端单进程同时承载 HTTP + Socket.io（http.createServer 复用）
# 因此不需要独立 WS upstream，全部走 jiaoyou_api 即可

server {
    listen 80;
    server_name api.jiaoyou.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.jiaoyou.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.jiaoyou.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jiaoyou.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block";

    client_max_body_size 4m;
    client_body_timeout 30s;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # 健康检查直返
    location = /health {
        proxy_pass http://jiaoyou_api/health;
        access_log off;
    }

    # Socket.io（长连接，需 Upgrade 头）
    location /socket.io/ {
        proxy_pass         http://jiaoyou_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 上传静态文件（开发期，生产建议接 OSS）
    location /static/ {
        proxy_pass http://jiaoyou_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 业务 API
    location /api/ {
        proxy_pass         http://jiaoyou_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    server_name jiaoyou.example.com www.jiaoyou.example.com;

    ssl_certificate     /etc/letsencrypt/live/jiaoyou.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiaoyou.example.com/privkey.pem;

    root /var/www/jiaoyou;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
